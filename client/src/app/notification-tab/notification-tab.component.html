<div class="container">
  <div class="heading">
    <p>Notifications</p>
  </div>
  
  <div class="notification-container">
    @for (notification of notifications; track notification.userId; let i = $index) {
      <div class="notification-card" [class.bg-[#FFB8008C]]="!notification.read" [class.bg-[#dcdcdcdb]]="notification.read">
        <div class="notification-header" (click)="toggleNotificationDetails(i)">
          <div class="header-content">
            <div class="notification-message">
              <p>{{ notification.message }}</p>
            </div>
            
            <div class="expand-icon" [class.expanded]="notification.isExpanded">
              <img src="/next.png" alt="expand icon" />
            </div>
          </div>
        </div>
        
        <div class="notification-details" [class.expanded]="notification.isExpanded">
          <div class="details-content">
            <div class="detail-row">
              <span class="detail-label">User ID:</span>
              <span class="detail-value">{{ notification.userId }}</span>
            </div>
            
            <div class="detail-row">
              <span class="detail-label">Name:</span>
              <span class="detail-value">{{ notification.name }}</span>
            </div>
            
            <div class="detail-row">
              <span class="detail-label">Email:</span>
              <span class="detail-value">{{ notification.email }}</span>
            </div>
          </div>
        </div>
      </div>
    }
  </div>
</div>
