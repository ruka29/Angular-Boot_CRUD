<div class="dashboard-container">
  <app-dashboard-side-panel
    [activeTab]="activeTab"
    (tabChange)="setActive($event)"
  ></app-dashboard-side-panel>
  
  <app-dashboard-action-panel
    [activeTab]="activeTab"
    [selectedUser]="selectedUser"
    (tabChange)="setActive($event.tab, $event.user)"
  ></app-dashboard-action-panel>

  <app-notification
    *ngIf="message"
    [message]="message"
    [messageType]="messageType"
    (close)="closeNotification()"
  ></app-notification>
</div>
